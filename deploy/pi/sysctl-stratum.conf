# Stratum-Memory — kernel VM tuning for the Raspberry Pi 4 (WP-14).
#
# Installed by deploy/pi/swap-setup.sh to /etc/sysctl.d/99-stratum.conf.
# Reference: MASTER-PLAN §10.4, ADR-0009.

# Keep the kernel from swapping out hot pages prematurely: the DB is swap-free
# in its container, so the host should swap only under real pressure.
vm.swappiness = 10

# Retain dentry/inode caches longer -> fewer re-reads of the SSD (which is the
# slowest part of the storage hierarchy on this box). Default is 100.
vm.vfs_cache_pressure = 50

# Heuristic overcommit (0). Do not allow wild overcommit: the DB must fail its
# allocation rather than let the OOM killer pick a victim at random.
vm.overcommit_memory = 0
