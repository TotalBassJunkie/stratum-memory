# Stratum-Memory — zram swap tuning for the Raspberry Pi 4 (WP-14).
#
# Installed by deploy/pi/swap-setup.sh to /etc/default/zramswap, which is read
# by the `zramswap.service` unit shipped with the Debian `zram-tools` package.
#
# Rationale (MASTER-PLAN §10.4, ADR-0009):
#   * zram compresses short-lived *system* pages in RAM. It must never serve
#     Postgres: stratum-db is deployed with memswap_limit == mem_limit, i.e. the
#     DB container has NO swap at all, so zram only ever holds host/OS pages.
#   * 1 GB compressed swap, priority 100 -> drained before the SSD swapfile
#     (priority 10) because higher priority is used first.
#   * zstd: best ratio on a Pi 4 without measurable CPU cost for this size.
ALGO=zstd
SIZE=1024
PRIORITY=100
