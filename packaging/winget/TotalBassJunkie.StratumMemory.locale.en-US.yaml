ShortDescription: Unified AI memory and context system (4 layers, ECL ingestion, curator gate, MCP API).
Description: |
  Stratum-Memory is a unified AI memory and context system built on a single
  namespace (stratum://<bereich>/<tenant>/<pfad>) over four layers: a
  Git-versioned filesystem vault (L0-L2), a bi-temporal fact/entity graph, a
  pgvector-backed vector and KV layer, and a budgeted reflect/synthesis worker.

  An ECL ingestion pipeline (Extract -> Cognify -> Load) stages every candidate
  and a curator validation gate is the only bridge into the active tables, so
  nothing is promoted without review. The MCP-compatible tool API (write, query,
  get, promote, archive, forget, link, session_append, reflect, health) is the
  agent surface.

  The `stratum` CLI bootstraps and drives the Docker stack (install, up, down,
  status, logs, mcp, health, version, doctor).
