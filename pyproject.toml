[project]
name = "stratum-memory"
version = "0.1.0"
description = "Stratum-Memory: unified AI memory and context system (4 layers, ECL ingestion, curator gate, MCP API)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "uvicorn[standard]>=0.30",
    "mcp>=1.2,<2",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "tenacity>=9.0",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
    # Optional at runtime: only ``tests/test_deploy_server.py`` imports it (and
    # falls back to ``docker compose config`` when it is absent). Never needed
    # by the shipped package, so it lives here rather than in ``dependencies``.
    "PyYAML>=6.0",
]

[project.scripts]
stratum = "stratum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stratum"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "integration: needs a live Postgres (pgvector) instance via STRATUM_TEST_DB",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["stratum"]
ignore_missing_imports = true
warn_unused_ignores = true
